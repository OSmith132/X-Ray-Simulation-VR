name: Unity tests
on: [push, pull_request]
jobs:
  test:
    name: Test in ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # These parts are from: https://game.ci/docs/github/test-runner/ (accessed 22/08/2026)




      # Free up disk space before pulling the Unity Docker image as the image can exceed the space available
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force



      # Caching (could speed up tests by more than 50% aparently)
      - uses: actions/cache@v3
        with:
          path: ./Library
          key: Library-XRaySimulationVR-${{ matrix.testMode }} # Keep editmode and playmode seperate
          restore-keys: |
            Library-XRaySimulationVR-
            Library-




      # Basic setup with Personal license + viewing test results
      - uses: game-ci/unity-test-runner@v4
        id: myTestStep
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}



      # Specifying artifacts folder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: ${{ steps.myTestStep.outputs.artifactsPath }}




      # Getting coverage results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coverage results
          path: ${{ steps.myTestStep.outputs.coveragePath }}